name: app
type: 'php:8.2'
disk: 1024

build:
  flavor: none

dependencies:
  php:
    composer/composer: '^2'

web:
  locations:
    '/':
      root: 'public'
      index:
        - index.php
      passthru: '/index.php'

mounts:
  '/var/uploads': 'shared:files'

relationships:
  database: 'db:mysql'

hooks:
  build: |
    composer install --no-dev --optimize-autoloader
    php bin/console assets:install public
    php bin/console cache:clear
  deploy: |
    php bin/console doctrine:migrations:migrate --no-interaction

crons:
  clear-cache:
    spec: '0 4 * * *'
    cmd: 'php bin/console cache:clear'

variables:
  env:
    APP_ENV: 'prod'
    APP_SECRET: 'f95042bbad6fc4fa08f2d7e71e5edc91e12ec528b3be1c10a786f3c1612d1696'
    DATABASE_URL: 'mysql://Jose:Eco2025@db:3306/Ride'

