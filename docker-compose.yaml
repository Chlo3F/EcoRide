services:
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
    networks:
      - app-network
  
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile  
    environment:
      APP_ENV: prod
    env_file:
    - .env.docker 
    volumes:
    - ./:/var/www/html
    depends_on:
      - db
    networks:
    - app-network
  db:
    image: mariadb:10.6
    restart: always
    env_file:
    - .env.docker
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - app-network


volumes:
  mariadb_data:

networks:
  app-network:
    driver: bridge